<script>
  const bgMusic = document.getElementById("bg-music");
  bgMusic.volume = 0.1;

  function startMusic() {
    bgMusic.play().then(() => {
      ["click", "pointerdown", "touchstart", "keydown", "scroll"].forEach(evt =>
        document.removeEventListener(evt, startMusic)
      );
    }).catch(err => console.log("Autoplay bloqueado, aguardando interação:", err));
  }

  // tenta tocar direto (funciona só se o navegador permitir)
  startMusic();

  // se bloqueado, toca na primeira interação
  ["click", "pointerdown", "touchstart", "keydown", "scroll"].forEach(evt =>
    document.addEventListener(evt, startMusic, { once: false })
  );
</script>
