    transform: translateZ(0);
    backface-visibility: hidden;

  /* brilho leve na borda, igual às pílulas do banner */
  #ssPlayerCard::before{
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(236,238,240,.12), rgba(236,238,240,0));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
  }

  #ssPlayerCard .play-btn{
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: transform .15s ease, background .2s ease;
  }
  #ssPlayerCard .play-btn:hover{ transform: scale(1.06); background: #2f2324; }
  #ssPlayerCard .play-btn:active{ transform: scale(.96); }
  #ssPlayerCard .play-btn svg{ width:16px; height:16px; fill: var(--cloud); margin-left:3px; }
  #ssPlayerCard .play-btn.is-playing svg{ margin-left:0; }

  #ssPlayerCard .player-meta{ flex:1; min-width:0; }
  #ssPlayerCard .player-meta .t1{
    font-size: 26px;
    font-weight: 500;
    line-height: 1;
    margin: 0;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #ssPlayerCard .player-meta .t2{
    font-size: 14px;
    font-weight: 500;
    line-height: 1;
    color: var(--ink);
    opacity: .7;
    margin: 5px 0 0;
  }

  #ssPlayerCard .waveform{
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 28px;
    margin-top: 12px;
  }
  #ssPlayerCard .waveform i{
    width: 3px;
    border-radius: 3px;
    display: block;
    min-height: 3px;
    background: var(--ink);
    transition: height .06s linear;
  }
  /* o degradê de opacidade dá o ar "suave" das nuvens */
  #ssPlayerCard .waveform i:nth-child(3n+1){ opacity: 1; }
  #ssPlayerCard .waveform i:nth-child(3n+2){ opacity: .75; }
  #ssPlayerCard .waveform i:nth-child(3n){ opacity: .5; }

  #ssPlayerCard .player-progress{
    height: 4px;
    background: rgba(65,49,50,.25);
    border-radius: 4px;
    margin-top: 12px;
    overflow: hidden;
    cursor: pointer;
  }
  #ssPlayerCard .player-progress .fill{
    height: 100%;
    width: 0%;
    background: var(--ink);
    border-radius: 4px;
  }
</style>
</head>
<body>

<audio id="ssTrack" preload="metadata" crossorigin="anonymous">
  <source src="https://dzgeverywhere.github.io/html/01.mp3" type="audio/mpeg">
</audio>

<div id="ssPlayerCard">
  <button class="play-btn" id="ssPlayBtn" aria-label="Tocar / pausar">
    <svg id="ssIconPlay" viewBox="0 0 24 24" style="display: block;"><path d="M4 2 L22 12 L4 22 Z"></path></svg>
    <svg id="ssIconPause" viewBox="0 0 24 24" style="display: none;"><path d="M5 2 H10 V22 H5 Z M14 2 H19 V22 H14 Z"></path></svg>
  </button>
  <div class="player-meta">
    <p class="t1">constant thoughts</p>
    <p class="t2">the little ear</p>
    <div class="waveform" id="ssWaveform">
      <i style="height:4px"></i><i style="height:4px"></i><i style="height:4px"></i><i style="height:4px"></i><i style="height:4px"></i><i style="height:4px"></i><i style="height:4px"></i><i style="height:4px"></i><i style="height:4px"></i><i style="height:4px"></i><i style="height:4px"></i><i style="height:4px"></i>
    </div>
    <div class="player-progress" id="ssProgressBar"><div class="fill" id="ssProgressFill"></div></div>
  </div>
</div>

<script>
(function(){
  const audio       = document.getElementById('ssTrack');
  const playBtn      = document.getElementById('ssPlayBtn');
  const iconPlay     = document.getElementById('ssIconPlay');
  const iconPause    = document.getElementById('ssIconPause');
  const bars         = document.querySelectorAll('#ssWaveform i');
  const progressBar  = document.getElementById('ssProgressBar');
  const progressFill = document.getElementById('ssProgressFill');

  let audioCtx, analyser, source, dataArray, rafId;
  let corsBlocked = false;

  function setupAudioGraph(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    try {
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    } catch(err) {
      console.error('CORS bloqueou o analyser:', err);
      corsBlocked = true;
    }
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  }

  function drawFrame(){
    if (!corsBlocked) {
      analyser.getByteFrequencyData(dataArray);
      bars.forEach((bar, i) => {
        const raw = dataArray[i * 4] || 0;
        const h = 4 + (raw/255) * 26;
        bar.style.height = h.toFixed(1) + 'px';
      });
    }
    updateProgress();
    rafId = requestAnimationFrame(drawFrame);
  }

  function updateProgress(){
    if (audio.duration) {
      progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    }
  }

  function setPlayingUI(isPlaying){
    playBtn.classList.toggle('is-playing', isPlaying);
    iconPlay.style.display  = isPlaying ? 'none' : 'block';
    iconPause.style.display = isPlaying ? 'block' : 'none';
  }

  playBtn.addEventListener('click', async () => {
    setupAudioGraph();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    if (audio.paused) {
      audio.play().catch(err => console.error('Erro ao tocar:', err));
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', () => {
    setPlayingUI(true);
    cancelAnimationFrame(rafId);
    drawFrame();
  });

  audio.addEventListener('pause', () => {
    setPlayingUI(false);
    cancelAnimationFrame(rafId);
  });

  audio.addEventListener('ended', () => {
    setPlayingUI(false);
    cancelAnimationFrame(rafId);
    progressFill.style.width = '0%';
  });

  audio.addEventListener('error', (e) => {
    console.error('ERRO NO AUDIO:', audio.error);
  });

  progressBar.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audio.currentTime = ratio * audio.duration;
  });
})();
</script>
